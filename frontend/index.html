<title>NVAMP · Ninja Van Automation Maintenance Platform</title>
<style>
:root{
  color-scheme: light;
  --bg:#f5f5f3; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e1dc;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7974;
  --accent:#2a78d6; --accent-ink:#ffffff;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --info:#2a78d6;
  --good-ink:#006300; --warn-ink:#8a5a00; --serious-ink:#a1461f; --critical-ink:#b02a2a;
  --series-1:#2a78d6; --series-2:#d9730d;
  --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#262624; --border:#383835;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#9a998f;
    --accent:#3987e5;
    --good-ink:#4cc94c; --warn-ink:#fab219; --serious-ink:#ec835a; --critical-ink:#e66767;
    --series-1:#3987e5; --series-2:#f09a45;
    --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--surface);border-right:1px solid var(--border);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:15px;margin:2px 8px 4px}
nav h1.brand{display:flex;align-items:center;gap:8px;font-size:17px}nav h1.brand img{height:40px;width:auto;flex:none}
nav .sub{font-size:12px;color:var(--muted);margin:0 8px 16px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--text-2);text-decoration:none;margin-bottom:2px}
nav a:hover{background:var(--surface-2)}
nav a.active{background:var(--surface-2);color:var(--text);font-weight:600}
nav .badge{font-size:11px;background:var(--critical);color:#fff;border-radius:10px;padding:0 7px;font-weight:600}
nav .foot{margin-top:24px;padding:0 8px;font-size:12px;color:var(--muted)}
main{padding:22px 28px 60px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{margin:0;font-size:20px}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dz{outline:2px dashed var(--accent)!important;outline-offset:2px;border-radius:8px;background:color-mix(in srgb,var(--accent) 7%,transparent)}
.dz.dzhot{outline-style:solid!important;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.dzbar{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:9999;background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);pointer-events:none;max-width:90vw;text-align:center}
.dzhint{font-size:11px;color:var(--muted);font-weight:400}
.msearch{position:relative}.msearch input#tmodQ{width:100%;box-sizing:border-box;padding-right:32px}.msearch .mclr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--muted);font-size:13px;padding:4px}
.mslist{position:absolute;left:0;right:0;top:calc(100% + 4px);max-height:280px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);z-index:30;padding:4px 0}
.mslist button{display:flex;width:100%;text-align:left;gap:10px;align-items:baseline;padding:7px 10px;border:0;background:none;font:inherit;font-size:13px;cursor:pointer;color:var(--text)}
.mslist button:hover,.mslist button.act{background:color-mix(in srgb,var(--accent) 10%,transparent)}.mslist .code{font-weight:600;min-width:52px}.mslist .par{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.tkst{display:flex;gap:8px;flex-wrap:wrap}.tkst label{flex:1;min-width:170px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex!important;flex-direction:row!important;gap:8px;align-items:flex-start;font-size:13px}.tkst label input{display:none}.tkst label.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent);box-shadow:inset 0 0 0 1px var(--accent)}
.tkph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tkph img{width:96px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.tkbox{background:var(--surface-2);border-radius:8px;padding:8px 12px}
.gph .g img{object-fit:cover}
.btn{border:1px solid var(--border);background:var(--surface);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--critical-ink)}
input,select,textarea{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 9px}
textarea{width:100%;min-height:60px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin-bottom:16px}
.tile .lbl{font-size:12px;color:var(--text-2)}
.tile .val{font-size:26px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .note{font-size:12px;color:var(--muted)}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--accent)}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 12px}.tabbar button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;color:var(--text-2);cursor:pointer;margin-bottom:-1px}.tabbar button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}.tabbar .cnt{font-size:11px;background:var(--surface-2);border-radius:9px;padding:1px 6px;margin-left:4px}
.two{grid-template-columns:1.4fr 1fr}
@media (max-width:1000px){.two{grid-template-columns:1fr}.app{grid-template-columns:1fr}nav{position:static;height:auto}}
h3{font-size:14px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--text-2);font-size:12px;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
td:first-child{white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px 1px 6px;border-radius:10px;background:var(--surface-2);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%}
.s-good{color:var(--good-ink)}.s-good .dot{background:var(--good)}
.s-warn{color:var(--warn-ink)}.s-warn .dot{background:var(--warning)}
.s-serious{color:var(--serious-ink)}.s-serious .dot{background:var(--serious)}
.s-crit{color:var(--critical-ink)}.s-crit .dot{background:var(--critical)}
.s-info{color:var(--accent)}.s-info .dot{background:var(--accent)}
.s-mute{color:var(--muted)}.s-mute .dot{background:var(--muted)}
.machines{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.mcard{cursor:pointer;border-left:4px solid var(--border)}
.mcard:hover{border-color:var(--accent)}
.mcard.st-Running{border-left-color:var(--good)}.mcard.st-Degraded{border-left-color:var(--warning)}
.mcard.wide{grid-column:span 3}
@media (max-width:1150px){.mcard.wide{grid-column:1/-1}}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
.subsys{background:var(--surface-2);border-radius:8px;padding:8px 10px;border-top:3px solid var(--good)}
.subsys.down{border-top-color:var(--critical)}
.subsys{cursor:pointer}

<script>
(function(){
"use strict";
const DAY = 864e5;
const today = new Date(); today.setHours(0,0,0,0);
const iso = d => { const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const addDays = (d,n) => new Date(new Date(d).getTime()+n*DAY);
const parseD = s => { const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/DAY);
const fmtD = s => s ? parseD(s).toLocaleDateString(undefined,{day:"numeric",month:"short"}) : "—";
const fmtT = t => t ? new Date(t).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "—";
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n,c) => currencyOf(c) + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0});
const pct = (n,d=1) => isFinite(n) ? n.toFixed(d)+"%" : "—";
const genId = p => { const d=new Date(); return p+"-"+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+Math.random().toString(36).slice(2,6).toUpperCase(); };
const clean = o => JSON.parse(JSON.stringify(o));

/* ---------- shared state (mirrors the shared database) ---------- */
const D = {tickets:[],opssortq:[],opssort:[],opsdw:[],stocktakes:[],vendors:[],members:[],partlog:[],machines:[],parts:[],wos:[],pmPlans:[],prs:[],approvals:{},events:[],metrics:[],settings:{sites:[],techs:[],currency:"S$",defaultCountry:"SG",siteCountry:{},siteTypes:{},countries:{SG:"Singapore"}}};
const COLS = {machines:"machines",parts:"parts",workorders:"wos",pmplans:"pmPlans",prs:"prs"};
let db=null, user=null, ME=null, CAN_WRITE=true, IS_APPROVER=false, IS_OWNER=false;
let CONN="connecting"; const gotFirst=new Set(); const NEED=["machines","parts","workorders","pmplans","prs","approvals","events","metrics","settings"];
const NAMES={}; const asked=new Set();

let SITE="All sites"; try{ SITE=localStorage.getItem("automaint-site")||"All sites"; }catch(e){}
let OP="All operations"; try{ OP=localStorage.getItem("automaint-op")||"All operations"; }catch(e){}
let COUNTRY=null; try{ COUNTRY=localStorage.getItem("automaint-country"); }catch(e){}

/* ---------- helpers ---------- */
const M = id => D.machines.find(m=>m.id===id);
const P = id => D.parts.find(p=>p.id===id);
const inCountry = c => !COUNTRY || COUNTRY==="All countries" || c===COUNTRY;
const siteInScope = site => SITE==="All sites" ? inCountry(countryOfSite(site)) : site===SITE;
const inSite = m => !!m && (SITE==="All sites" ? inCountry(m.country||countryOfSite(m.site)) : m.site===SITE) && (OP==="All operations" || m.operation===OP);
const operations = () => (D.settings.operations&&D.settings.operations.length) ? D.settings.operations : ["Core","Cold Chain"];
const TYPE_OP = {"Bulky parcel sorter":"Core","Parcel sorter":"Core","Static DWS":"Core","Bulky DWS":"Core","Blast freezer":"Cold Chain","Storage freezer":"Cold Chain"};
const opOfType = t => ((D.settings.typeOperation||{})[t]) || TYPE_OP[t] || operations()[0];
const opTypes = op => [...new Set(D.machines.filter(m=>m.operation===op).map(m=>m.type))];
const partInOp = p => { if(OP==="All operations") return true; const ms=(p.machines||[]).map(M).filter(Boolean); if(ms.length) return ms.some(m=>m.operation===OP); return (p.operation||"Core")===OP; };
const scopeLabel = () => [OP==="All operations"?"All operations":OP, SITE==="All sites"?(COUNTRY&&COUNTRY!=="All countries"?"all "+countryName(COUNTRY)+" sites":"all countries"):SITE].join(" · ");

const TK_REJECT=["Operator or process issue","Upstream or downstream equipment","Duplicate of another ticket","No fault found","Other"];
const TK_VIEWS_OPS=["tickets","machines"];
const opsOnly = () => { if(!ME||IS_OWNER) return false; const R=rolesOf(ME); return R.length>0&&R.every(r=>r==="operations"); };
const tkTitle = t => { const s=String(t.desc||"").split(/\r?\n/)[0].trim(); return s?(s.length>70?s.slice(0,70)+"…":s):"Machine problem"; };

const tkWO = t => t.woId?D.wos.find(w=>w.id===t.woId):null;
function tkStatus(t){
  if(t.status==="New") return {k:"new",cls:"s-serious",label:(t.reopened||[]).length?"Reopened · waiting for review":"Waiting for review"};
  if(t.status==="Rejected") return {k:"rejected",cls:"s-mute",label:"Not a machine fault"};
  if(t.status==="Closed") return {k:"closed",cls:"s-good",label:"Closed"};
  const w=tkWO(t); const s=w?w.status:"Open";
  if(s==="Completed") return {k:"fixed",cls:"s-good",label:"Fixed · please confirm"};
  if(s==="In progress") return {k:"work",cls:"s-warn",label:"Being fixed"};
  if(s==="On hold") return {k:"work",cls:"s-mute",label:"On hold"};
  return {k:"work",cls:"s-info",label:"Work order open"}; }
const tkOpen = t => !["rejected","closed"].includes(tkStatus(t).k);
const ago = t => { const m=Math.round((Date.now()-new Date(t))/6e4); return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"; };

/* on duty: engineers / technicians mark themselves on duty at one site; it lapses after DUTY_HRS */
const DUTY_HRS=14;
function dutyOf(uid){ const mb=D.members.find(x=>x.id===uid); const d=mb&&mb.duty; if(!d||!d.site||!d.since) return null; if(Date.now()-new Date(d.since)>DUTY_HRS*36e5) return null; return d; }

  return save([()=>ref.get().then(s=>ref.set(Object.assign({},s.exists?s.data():{},{duty:site?{site,since:t}:null})))],site?"You're on duty at "+site+" until you go off duty, or for "+DUTY_HRS+" hours":"You're off duty"); }

/* ---------- metric calcs ---------- */
function calc(machineIds, days){
  const from=iso(addDays(today,-days)), to=iso(today);
  const rows=D.metrics.filter(r=>machineIds.includes(r.machineId)&&r.date>=from&&r.date<to);
  const sched=rows.reduce((a,r)=>a+r.schedMin,0), down=rows.reduce((a,r)=>a+r.downtimeMin,0), fails=rows.reduce((a,r)=>a+r.failures,0);
  const tp=rows.reduce((a,r)=>a+r.throughput,0), jams=rows.reduce((a,r)=>a+r.jams,0);
  const rr = tp? rows.reduce((a,r)=>a+r.readRate*r.throughput,0)/tp : NaN;
  return {avail: sched? (sched-down)/sched*100 : NaN, downMin:down, failures:fails,
    mtbf: fails? (sched-down)/60/fails : NaN, mttr: fails? down/fails : NaN, throughput:tp, readRate:rr, jams, jamsPer10k: tp? jams/tp*1e4 : NaN, rows};
}
function dailyAvail(ids,days){
  const out=[];
  for(let d=days; d>=1; d--){ const date=iso(addDays(today,-d)); const rows=D.metrics.filter(r=>r.date===date&&ids.includes(r.machineId));
    const s=rows.reduce((a,r)=>a+r.schedMin,0), dn=rows.reduce((a,r)=>a+r.downtimeMin,0);
    out.push({x:date,y:s?(s-dn)/s*100:null}); }
  return out;
}

/* ---------- charts ---------- */
const tipEl=document.getElementById("tip");
function showTip(host,html,x,y){ tipEl.innerHTML=html; tipEl.style.display="block"; tipEl.style.position="fixed"; const r=tipEl.getBoundingClientRect(); let L=x+12, T=y-r.height-8; if(L+r.width>innerWidth-8) L=x-r.width-12; if(T<8) T=y+14; tipEl.style.left=L+"px"; tipEl.style.top=T+"px"; }
function hideTip(){ tipEl.style.display="none"; }
function lineChart(host,data,name){
  const W=Math.max(320,Math.round(host.clientWidth||640)),H=220,ml=40,mr=12,mt=10,mb=26; const pts=data.filter(d=>d.y!=null);
  if(!pts.length){ host.innerHTML=`<div class="empty">No metrics for this period yet. Import a CSV under Performance reports.</div>`; return; }
  let lo=Math.min(...pts.map(d=>d.y)), hi=100; lo=Math.max(0,Math.floor((lo-2)/2)*2); if(hi-lo<4) lo=hi-4;
  const x=i=>ml+(W-ml-mr)*(data.length===1?0.5:i/(data.length-1)), y=v=>mt+(H-mt-mb)*(1-(v-lo)/(hi-lo));
  const ticks=[]; const step=(hi-lo)<=10?2:(hi-lo)<=20?5:10; for(let t=Math.ceil(lo/step)*step;t<=hi;t+=step) ticks.push(t);
  const path=data.map((d,i)=>d.y==null?"":`${i&&data[i-1].y!=null?"L":"M"}${x(i).toFixed(1)},${y(d.y).toFixed(1)}`).join("");
  const xl=[0,Math.floor((data.length-1)/2),data.length-1];
  host.innerHTML=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(name)} by day">
  <g class="grid">${ticks.map(t=>`<line x1="${ml}" x2="${W-mr}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>
  <g class="axis">${ticks.map(t=>`<text x="${ml-6}" y="${y(t)+4}" text-anchor="end">${t}%</text>`).join("")}${xl.map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":i===data.length-1?"end":"middle"}">${fmtD(data[i].x)}</text>`).join("")}</g>
  <path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <line class="xh" x1="0" x2="0" y1="${mt}" y2="${H-mb}" stroke="var(--muted)" stroke-dasharray="3 3" style="display:none"/>
  <circle class="dotH" r="4.5" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" style="display:none"/>
  <rect x="${ml}" y="${mt}" width="${W-ml-mr}" height="${H-mt-mb}" fill="transparent" class="hit"/></svg></div>`;
  const svg=host.querySelector("svg"), xh=svg.querySelector(".xh"), dot=svg.querySelector(".dotH");
  svg.querySelector(".hit").addEventListener("mousemove",e=>{ const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)*W/r.width;
    const i=Math.max(0,Math.min(data.length-1,Math.round((px-ml)/(W-ml-mr)*(data.length-1)))); const d=data[i]; if(d.y==null) return;
    xh.setAttribute("x1",x(i)); xh.setAttribute("x2",x(i)); xh.style.display=""; dot.setAttribute("cx",x(i)); dot.setAttribute("cy",y(d.y)); dot.style.display="";
    showTip(host,`${parseD(d.x).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}<br>${esc(name)} <b>${d.y.toFixed(1)}%</b>`,e.clientX,e.clientY); });
  svg.querySelector(".hit").addEventListener("mouseleave",()=>{ xh.style.display="none"; dot.style.display="none"; hideTip(); });
}
function barChart(host,data){

  Object.entries(COLS).forEach(([col,key])=>{
    db.collection(col).onSnapshot(s=>{ D[key]=asList(s); if(!s.metadata.fromCache) markLoaded(col); else scheduleRender(); },onErr(col));

  db.collection("opssortq").onSnapshot(s=>{ const rows=[]; s.docs.forEach(d=>{ const v=d.data(); Object.entries(v.buckets||{}).forEach(([hm,r])=>{ if(r) rows.push({machineId:v.machineId,date:v.date,hm,k:v.date+"T"+hm,n:+r.n||0,read:+r.read||0,sorted:+r.sorted||0,dd:+r.dd||0,wd:+r.wd||0,rs:r.rs||{}}); }); }); D.opssortq=rows; scheduleRender(); },()=>{});
  db.collection("opsdw").onSnapshot(s=>{ const rows=[]; s.docs.forEach(d=>{ const v=d.data(); Object.entries(v.days||{}).forEach(([date,r])=>{ if(r) rows.push({machineId:v.machineId,date,n:+r.n||0,wd:+r.wd||0,dd:+r.dd||0,dev:r.dev||""}); }); }); D.opsdw=rows; scheduleRender(); },()=>{});
  db.collection("members").onSnapshot(s=>{ D.members=asList(s); scheduleRender(); },()=>{});
  registerMe();
  db.collection("partlog").orderBy("t","desc").limit(2000).onSnapshot(s=>{ D.partlog=asList(s); scheduleRender(); },()=>{});
  if(ME) db.doc("prefs/"+ME).onSnapshot(s=>{ PREFS=s.exists?s.data():{}; scheduleRender(); },()=>{});
  subscribeAudit();
  db.doc("settings/app").onSnapshot(s=>{ D.settings=Object.assign({sites:[],techs:[],currency:"S$"},s.exists?s.data():{}); if(!s.metadata.fromCache) markLoaded("settings"); else scheduleRender(); },onErr("settings"));
}

let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(!document.querySelector('.overlay')) render(); },200); });
connect();
})();
</script>
