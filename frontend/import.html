<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NVAMP backup import</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#5b6470; --card:#fff; --border:#d9dee5; --accent:#c8102e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171b; --fg:#e8eaed; --muted:#9aa3ad; --card:#1d2126; --border:#2e343b; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:560px; margin:40px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 16px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px 16px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  pre { white-space:pre-wrap; font-size:13px; background:var(--bg); padding:10px; border-radius:6px; }
  a { color:inherit; }
</style>
</head>
<body>
<main><div class="card">
  <h1>Import an NVAMP backup</h1>
  <p>Choose an <code>nvamp-backup-YYYY-MM-DD.json</code> file (from Team &amp; settings → Back up all data). Records are added or replaced by id; nothing is deleted. Only NVAMP owners can import. Photos, signatures and documents are not inside the backup and won't appear.</p>
  <p><input type="file" id="f" accept=".json,application/json"></p>
  <button id="go" disabled>Import</button>
  <pre id="out" hidden></pre>
  <p style="margin-top:16px"><a href="/">← Back to NVAMP</a></p>
</div></main>
<script>
  const f = document.getElementById("f"), go = document.getElementById("go"), out = document.getElementById("out");
  f.onchange = () => { go.disabled = !f.files.length; };
  go.onclick = async () => {
    go.disabled = true; out.hidden = false; out.textContent = "Importing…";
    try {
      const text = await f.files[0].text();
      const r = await fetch("/api/admin/import", { method: "POST", headers: { "Content-Type": "application/json" }, body: text });
      const j = await r.json().catch(() => ({}));
      out.textContent = r.ok
        ? "Imported " + j.documents + " records.\n" + Object.entries(j.counts).map(([k, v]) => k + ": " + v).join("\n")
        : "Not imported: " + (j.detail || ("HTTP " + r.status));
    } catch (e) { out.textContent = "Not imported: " + e.message; }
    go.disabled = false;
  };
</script>
</body>
</html>
